name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH, without the v prefix)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and create tag when manually started
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Start manual releases from the main branch."
              exit 1
            fi
            if [[ ! "$INPUT_VERSION" =~ ^(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
              echo "::error::Enter a version in MAJOR.MINOR.PATCH format, for example 1.2.3."
              exit 1
            fi
            RELEASE_TAG="v$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "::error::Tag $RELEASE_TAG already exists. Choose a new version."
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "FrameTube $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a version tag in vMAJOR.MINOR.PATCH format; received '$RELEASE_TAG'."
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed release APK
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check release signing secrets and decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.FRAME_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FRAME_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FRAME_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FRAME_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$KEYSTORE_BASE64" ]] || missing+=("FRAME_RELEASE_KEYSTORE_BASE64")
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing+=("FRAME_RELEASE_KEYSTORE_PASSWORD")
          [[ -n "$KEY_ALIAS" ]] || missing+=("FRAME_RELEASE_KEY_ALIAS")
          [[ -n "$KEY_PASSWORD" ]] || missing+=("FRAME_RELEASE_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Release signing is not configured. Add these repository Actions secrets: %s\n' "${missing[*]}"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/frametube-release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"; then
            echo "::error::Could not decode FRAME_RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          if [[ ! -s "$KEYSTORE_PATH" ]]; then
            echo "::error::The decoded release keystore is empty."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The keystore password or key alias is invalid. Check the release signing secrets."
            exit 1
          fi
          echo "FRAME_RELEASE_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Run unit tests and assemble release APK
        env:
          FRAME_RELEASE_STORE_PASSWORD: ${{ secrets.FRAME_RELEASE_KEYSTORE_PASSWORD }}
          FRAME_RELEASE_KEY_ALIAS: ${{ secrets.FRAME_RELEASE_KEY_ALIAS }}
          FRAME_RELEASE_KEY_PASSWORD: ${{ secrets.FRAME_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon clean testDebugUnitTest assembleRelease -PreleaseVersion="${{ needs.prepare.outputs.value }}"

      - name: Verify APK exists and prepare release asset
        id: apk
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          if [[ ! -d "$APK_DIR" ]]; then
            echo "::error::Release APK output directory was not created: $APK_DIR"
            exit 1
          fi

          mapfile -t apks < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -size +0c -print)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one non-empty release APK in $APK_DIR; found ${#apks[@]}."
            find "$APK_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi

          ASSET="FrameTube-${RELEASE_TAG}.apk"
          cp "${apks[0]}" "$ASSET"
          echo "path=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameTube-${{ needs.prepare.outputs.tag }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create GitHub Release and attach APK
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: FrameTube-${{ needs.prepare.outputs.tag }}
          path: release-assets

      - name: Verify release asset
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find release-assets -maxdepth 1 -type f -name '*.apk' -size +0c -print)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one non-empty APK artifact to publish."
            exit 1
          fi

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "FrameTube $RELEASE_TAG" \
            --generate-notes
