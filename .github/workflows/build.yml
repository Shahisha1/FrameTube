name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Check the APK is named FrameTube.apk
        run: |
          ls -l app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/FrameTube.apk

      - name: Android lint (report only)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FrameTube
          path: app/build/outputs/apk/debug/FrameTube.apk
          if-no-files-found: error
